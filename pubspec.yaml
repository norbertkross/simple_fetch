name: simple_fetch

description: Turn Dio responses into typed models. Works for JSON objects, lists, and nested payloads across current Flutter versions.

version: 0.1.0

homepage: https://github.com/norbertkross/simple_fetch
repository: https://github.com/norbertkross/simple_fetch
issue_tracker: https://github.com/norbertkross/simple_fetch/issues

topics:
  - dio
  - http
  - network
  - interceptor
  - middleware

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
